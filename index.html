<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Portal Ensaios de Solos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(160deg, #013C5A 0%, #025d85 100%);
      font-family: 'Open Sans', sans-serif;
      color: #fff;
    }
    .login-container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
      text-align: center;
      width: 330px;
      animation: fadeIn .8s ease-in-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    h2 {
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 20px;
      color: #fff;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,.6); }
    button {
      width: 48%;
      padding: 10px;
      margin: 10px 1%;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: 0.3s;
    }
    #loginBtn { background: #28a745; color: #fff; }
    #loginBtn:hover { background: #2ecc71; }
    #registerBtn { background: #555; color: #fff; }
    #registerBtn:hover { background: #777; }
    p {
      font-size: 0.9rem;
      margin-top: 10px;
      color: rgba(255,255,255,.7);
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2>🔐 Acesso ao Portal</h2>
    <input type="email" id="email" placeholder="Digite seu e-mail" />
    <input type="password" id="password" placeholder="Digite sua senha" />
    <div>
      <button id="loginBtn">Entrar</button>
      <button id="registerBtn">Cadastrar</button>
    </div>
    <p>Seu acesso é pessoal e intransferível.</p>
  </div>

  <!-- 🔥 SCRIPT FIREBASE -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    // === CONFIG FIREBASE ===
    const firebaseConfig = {
      apiKey: "AIzaSyDY5IFakVFbbLn8UQHUCgea7KOx_zZjvlY",
      authDomain: "portal-ensaios-solos-vol1.firebaseapp.com",
      projectId: "portal-ensaios-solos-vol1",
      storageBucket: "portal-ensaios-solos-vol1.firebasestorage.app",
      messagingSenderId: "217730071254",
      appId: "1:217730071254:web:a79fa9cbf49f742ff62777"
    };

    // === INICIALIZAÇÃO SEGURA ===
    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // === CRIA DOCUMENTO DO USUÁRIO NO FIRESTORE ===
    async function ensureUserDoc(user) {
      if (!user) return;

      // Delay necessário para sincronizar UID nas regras
      await new Promise(resolve => setTimeout(resolve, 500));

      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        try {
          await setDoc(ref, {
            email: user.email || "",
            nome: user.displayName || "",
            acesso: false, // Bloqueado até liberação manual
            dataCadastro: serverTimestamp(),
            progresso: { mod0: false, mod1: false, mod2: false, mod3: false, mod4: false }
          });
          console.log("📄 Documento criado no Firestore:", user.email);
        } catch (err) {
          console.error("🔥 Erro ao salvar no Firestore:", err.message);
        }
      } else {
        console.log("✅ Documento já existia:", user.email);
      }
    }

    // === AUTO LOGIN ===
    onAuthStateChanged(auth, (user) => {
      if (user && !window.location.href.includes("portal.html")) {
        console.log("👤 Usuário autenticado:", user.email);
        window.location.href = "./portal.html";
      }
    });

    // === LOGIN ===
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) return alert("Preencha e-mail e senha.");

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await ensureUserDoc(cred.user);
        alert("✔️ Login realizado com sucesso!");
        window.location.href = "./portal.html";
      } catch (error) {
        console.error("Erro ao logar:", error.message);
        alert("❌ Erro ao fazer login: " + error.message);
      }
    });

    // === CADASTRO ===
    document.getElementById("registerBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) return alert("Preencha e-mail e senha.");

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        console.log("✅ Usuário criado:", cred.user.uid);
        await ensureUserDoc(cred.user);
        alert("✅ Conta criada com sucesso! Agora entre no portal.");
      } catch (error) {
        console.error("❌ Erro no cadastro:", error.message);
        alert("❌ Erro ao criar conta: " + error.message);
      }
    });
  </script>
</body>
</html>
