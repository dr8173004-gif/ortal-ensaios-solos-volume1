<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Interativo – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 30px 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
      max-width: 400px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #0071E3;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #0A84FF;
      transform: scale(1.03);
    }
    .alt {
      margin-top: 12px;
    }
    .alt a {
      color: #9ecbff;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Entrar no Portal</h1>
    <input type="email" id="email" placeholder="E-mail" />
    <input type="password" id="password" placeholder="Senha" />
    <button id="loginBtn">Entrar</button>
    <button id="registerBtn">Cadastrar</button>
    <div class="alt">
      <a href="vitrine.html">← Voltar à vitrine</a>
    </div>
  </div>

  <script type="module">
    // === Importações Firebase ===
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    // === Configuração do Firebase ===
    const firebaseConfig = {
      apiKey: "AIzaSyDY5IFakVFbbLn8UQHUCgea7KOx_zZjvlY",
      authDomain: "portal-ensaios-solos-vol1.firebaseapp.com",
      projectId: "portal-ensaios-solos-vol1",
      storageBucket: "portal-ensaios-solos-vol1.firebasestorage.app",
      messagingSenderId: "217730071254",
      appId: "1:217730071254:web:a79fa9cbf49f742ff62777"
    };

    // === Inicialização segura ===
    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // === Cria documento do usuário ===
    async function ensureUserDoc(user) {
      if (!user) return;
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          email: user.email || "",
          nome: user.displayName || "",
          acesso: false,
          dataCadastro: serverTimestamp(),
          progresso: { mod0: false, mod1: false, mod2: false, mod3: false, mod4: false }
        });
        console.log("📄 Documento criado para:", user.email);
      } else {
        console.log("✅ Documento já existia para:", user.email);
      }
    }

    // === Redirecionamento automático se logado ===
    onAuthStateChanged(auth, (user) => {
      if (user && !window.location.href.includes("portal.html")) {
        window.location.href = "./portal.html";
      }
    });

    // === LOGIN ===
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) return alert("Preencha e-mail e senha.");

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        console.log("🔑 Login de:", cred.user.email);
        await ensureUserDoc(cred.user);
        alert("✔️ Login realizado com sucesso!");
        window.location.href = "./portal.html";
      } catch (error) {
        console.error(error);
        alert("❌ Erro ao fazer login: " + error.message);
      }
    });

    // === CADASTRO ===
    document.getElementById("registerBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) return alert("Preencha e-mail e senha.");

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        console.log("✅ Usuário criado:", cred.user.uid);

        // Aguarda autenticação completa antes de salvar no Firestore
        await new Promise(resolve => setTimeout(resolve, 500));
        await ensureUserDoc(cred.user);

        alert("✅ Conta criada com sucesso! Agora entre no portal.");
      } catch (error) {
        console.error("❌ Erro no cadastro:", error);
        alert("❌ Erro ao criar conta: " + error.message);
      }
    });
  </script>
</body>
</html>
