<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Interativo – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 30px 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
      max-width: 400px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #0071E3;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #0A84FF;
      transform: scale(1.03);
    }
    .alt {
      margin-top: 12px;
    }
    .alt a {
      color: #9ecbff;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Entrar no Portal</h1>
    <input type="email" id="email" placeholder="E-mail" />
    <input type="password" id="password" placeholder="Senha" />
    <button id="loginBtn" type="button">Entrar</button>
    <button id="registerBtn" type="button">Cadastrar</button>
    <div class="alt">
      <a href="vitrine.html">← Voltar à vitrine</a>
    </div>
  </div>

  <script type="module">
    import { app, auth, db } from "./firebase-init.js";
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    // === LOGGER PRO ===
    const log = (tag, msg, color="cyan") => console.log(`%c[${tag}] %c${msg}`, "color:gray;font-weight:600", `color:${color};font-weight:600`);
    const mark = (label) => performance.mark(label);

    log("SYSTEM", "🔥 Firebase inicializado via firebase-init.js", "lime");

    // === ELEMENTOS ===
    const emailEl = document.getElementById("email");
    const passEl  = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const regBtn   = document.getElementById("registerBtn");

    // === FUNÇÕES ===
    function val() {
      const email = (emailEl.value || "").trim();
      const pass  = (passEl.value  || "").trim();
      if (!email || !pass) { alert("Preencha e-mail e senha."); return null; }
      return { email, pass };
    }

    // === EVITAR DUPLICAÇÃO DE DOCUMENTOS ===

// Cria o documento do usuário apenas se ainda não existir
async function ensureUserDoc(user) {
  if (!user) return;

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref, {
      email: user.email,
      nome: user.displayName || "",
      dataCadastro: new Date().toISOString(),
      acesso: false,
      progresso: {
        mod0: 0,
        mod1: 0,
        mod2: 0,
        geral: 0
      }
    });
    console.log("✅ Novo usuário criado:", user.email);
  } else {
    console.log("📁 Usuário já existe, evitando duplicação.");
  }
}
  
    // === LOGIN ===
    loginBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const v = val(); if (!v) return;
      mark("login-start");
      try {
        log("AUTH", "Tentando login...", "deepskyblue");
        const cred = await signInWithEmailAndPassword(auth, v.email, v.pass);
        const user = cred.user;

// depois continua o fluxo normal
await ensureUserDoc(user);

// === VERIFICAÇÃO DE ACESSO NO FIRESTORE ===
const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

if (snap.exists()) {
  const dados = snap.data();

  if (dados.acesso === false) {
    log("ACCESS", "🚫 Acesso bloqueado: usuário não autorizado.", "red");
    alert("🚫 Seu acesso ao portal ainda não foi liberado.\nEntre em contato com o suporte.");
    await auth.signOut();
    return; // interrompe o login
  } else {
    log("ACCESS", "✅ Acesso liberado para o portal.", "lime");
  }
} else {
  log("ACCESS", "⚠️ Usuário não encontrado no Firestore.", "gold");
}

        
        mark("login-end");
        log("AUTH", `✔️ Login bem-sucedido: ${cred.user.email}`, "lime");
        console.log("⏱️ Tempo total login:", performance.measure("login", "login-start", "login-end").duration.toFixed(2), "ms");
        alert("✔️ Login realizado com sucesso!");
        location.href = "./portal.html";
      } catch (er) {
        log("AUTH", `❌ Falha no login: ${er.message}`, "red");
        console.error(er);
        alert("❌ Erro ao fazer login: " + er.message);
      }
    });

    // === CADASTRO ===
   regBtn.addEventListener("click", async (e) => {
  e.preventDefault();
  const v = val(); if (!v) return;
  mark("register-start");
  try {
    log("AUTH", "Criando conta...", "orange");
    const cred = await createUserWithEmailAndPassword(auth, v.email, v.pass); 

    // Cria documento do usuário (uma vez só)
    await ensureUserDoc(cred.user);

    alert("✅ Conta criada e salva no Firestore!");
    mark("register-end");
    log("AUTH", `✅ Conta criada e salva: ${cred.user.email}`, "lime");
    console.log("⏱️ Tempo total cadastro:", performance.measure("register", "register-start", "register-end").duration.toFixed(2), "ms");
  } catch (er) {
    log("AUTH", `❌ Erro ao criar conta: ${er.message}`, "red");
    console.error(er);
    alert("❌ Erro ao criar conta: " + er.message);
  }
});

  // === OBSERVADOR DE SESSÃO (somente login manual) ===
onAuthStateChanged(auth, (user) => {
  if (user) {
    log("FLOW", `👤 Usuário autenticado: ${user.email}`, "gold");
  } else {
    log("FLOW", "👤 Nenhum usuário logado atualmente.", "gray");
  }
});

  </script>
</body>
</html>
