<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Interativo – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 30px 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
      max-width: 400px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #0071E3;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #0A84FF;
      transform: scale(1.03);
    }
    .alt {
      margin-top: 12px;
    }
    .alt a {
      color: #9ecbff;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Entrar no Portal</h1>
    <input type="email" id="email" placeholder="E-mail" />
    <input type="password" id="password" placeholder="Senha" />
   <button id="loginBtn" type="button">Entrar</button>
<button id="registerBtn" type="button">Cadastrar</button>
    <div class="alt">
      <a href="vitrine.html">← Voltar à vitrine</a>
    </div>
  </div>
  <script type="module">
  // --- imports com cache-buster:
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js?v=4";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js?v=4";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js?v=4";

  document.addEventListener("DOMContentLoaded", () => {
    const app = getApps().length ? getApps()[0] : initializeApp({
      apiKey: "AIzaSyDY5IFakVFbbLn8UQHUCgea7KOx_zZjvlY",
      authDomain: "portal-ensaios-solos-vol1.firebaseapp.com",
      projectId: "portal-ensaios-solos-vol1",
      storageBucket: "portal-ensaios-solos-vol1.firebasestorage.app",
      messagingSenderId: "217730071254",
      appId: "1:217730071254:web:a79fa9cbf49f742ff62777"
    });
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // pega elementos com fallback
    const emailEl = document.getElementById("email") || document.querySelector("#email");
    const passEl  = document.getElementById("password") || document.querySelector("#password");
    const loginBtn = document.getElementById("loginBtn") || document.querySelector("#loginBtn");
    const regBtn   = document.getElementById("registerBtn") || document.querySelector("#registerBtn");

    // se tiver overlay de fade, garante que não bloqueia clique
    const fade = document.getElementById("fade-overlay");
    if (fade) fade.style.pointerEvents = "none";

    function val() {
      const email = (emailEl?.value || "").trim();
      const pass  = (passEl?.value  || "").trim();
      if (!email || !pass) { alert("Preencha e-mail e senha."); return null; }
      return { email, pass };
    }

    async function ensureUserDoc(user) {
      if (!user) return;
      // pequeno delay ajuda na propagação das regras
      await new Promise(r=>setTimeout(r, 300));
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          email: user.email || "",
          nome:  user.displayName || "",
          acesso: false,                         // você libera depois do pagamento
          dataCadastro: serverTimestamp(),
          progresso: { mod0:false, mod1:false, mod2:false, mod3:false, mod4:false }
        });
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user && !location.href.includes("portal.html")) {
        location.href = "./portal.html";
      }
    });

    // listeners com preventDefault por segurança
    loginBtn?.addEventListener("click", async (e) => {
      e.preventDefault();
      const v = val(); if (!v) return;
      try {
        const cred = await signInWithEmailAndPassword(auth, v.email, v.pass);
        await ensureUserDoc(cred.user);
        alert("✔️ Login realizado com sucesso!");
        location.href = "./portal.html";
      } catch (er) {
        console.error(er);
        alert("❌ Erro ao fazer login: " + er.message);
      }
    });

    regBtn?.addEventListener("click", async (e) => {
      e.preventDefault();
      const v = val(); if (!v) return;
      try {
        const cred = await createUserWithEmailAndPassword(auth, v.email, v.pass);
        await ensureUserDoc(cred.user);
        alert("✅ Conta criada com sucesso! Agora entre no portal.");
      } catch (er) {
        console.error(er);
        alert("❌ Erro ao criar conta: " + er.message);
      }
    });
  });
</script>

</body>
</html>
