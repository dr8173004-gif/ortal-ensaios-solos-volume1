<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Interativo – Volume 1</title>
</head>
<body>
  <!-- conteúdo original do portal -->
  <script type="module">
    import { auth } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const log = (msg, color="cyan") => console.log(`%c${msg}`, `color:${color};font-weight:600`);

    log("🧭 Verificando sessão de usuário...", "orange");

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        log("🚫 Nenhum usuário autenticado. Redirecionando para login.", "red");
        alert("⚠️ Você precisa estar logado para acessar o portal.");
        location.href = "./index.html";
      } else {
        log(`✅ Acesso autorizado para: ${user.email}`, "lime");
      }
    });
  </script>
</body>
</html>
