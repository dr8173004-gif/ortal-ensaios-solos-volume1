<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Interativo – Ensaios de Solos</title>

  <!-- =================== CABEÇALHO DO USUÁRIO (botão Sair) =================== -->
  <header id="userHeader" class="user-header" style="display:none">
    <span id="userName">👋 Olá, aluno</span>
    <button id="logoutBtn" class="logout-btn">Sair</button>
  </header>

  <style>
    .user-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 20px;
      background-color: #013C5A;
      color: white;
      font-family: 'Montserrat', sans-serif;
    }
    .logout-btn {
      margin-left: 10px;
      background-color: #28a745;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .logout-btn:hover {
      background-color: #218838;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <!-- =================== CONTEÚDO ORIGINAL DO PORTAL =================== -->
  <!-- (todo o conteúdo e módulos permanecem exatamente como estavam aqui) -->

  <!-- ==================== FIREBASE SESSÃO SEGURA ==================== -->
  <script type="module">
    import { auth } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const headerEl = document.getElementById("userHeader");
    const nameEl = document.getElementById("userName");
    const logoutBtn = document.getElementById("logoutBtn");

    // Verifica login ativo
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const nome = user.displayName || (user.email ? user.email.split("@")[0] : "aluno");
        if (nameEl) nameEl.textContent = `👋 Olá, ${nome}`;
        if (headerEl) headerEl.style.display = "flex";
        console.log(`✅ Usuário autenticado: ${user.email}`);
      } else {
        if (headerEl) headerEl.style.display = "none";
        alert("⚠️ Você precisa estar logado para acessar o portal.");
        window.location.href = "./index.html";
      }
    });

    // Botão de logout — encerra sessão antes do redirecionamento
    logoutBtn?.addEventListener("click", async () => {
      try {
        await signOut(auth);
        console.log("👋 Sessão encerrada com sucesso.");
      } catch (error) {
        console.error("Erro ao sair:", error);
      } finally {
        window.location.href = "./index.html";
      }
    });
  </script>
</body>
</html>
